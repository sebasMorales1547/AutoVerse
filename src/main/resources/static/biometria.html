<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación Biométrica — Autoverse</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>

<div class="bio-wrap">

    <!-- ENCABEZADO -->
    <div class="bio-header">
        <div class="bio-icon">
            <svg viewBox="0 0 24 24" fill="none" width="28" height="28">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke="#ffc400" stroke-width="1.5"/>
                <path d="M8 9.5C8 8.67 8.67 8 9.5 8S11 8.67 11 9.5 10.33 11 9.5 11 8 10.33 8 9.5z" fill="#ffc400"/>
                <path d="M13 9.5C13 8.67 13.67 8 14.5 8S16 8.67 16 9.5 15.33 11 14.5 11 13 10.33 13 9.5z" fill="#ffc400"/>
                <path d="M8.5 15c.83 1.5 2.17 2 3.5 2s2.67-.5 3.5-2" stroke="#ffc400" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>
        <div>
            <p class="bio-titulo">Verificación biométrica</p>
            <p class="bio-subtitulo">Confirma tu identidad para continuar</p>
        </div>
    </div>

    <!-- CÁMARA -->
    <div class="bio-camara-wrap" id="camaraWrap">
        <video id="video" autoplay muted playsinline class="bio-video"></video>
        <canvas id="canvas" class="bio-canvas"></canvas>
        <div class="bio-overlay">
            <div class="bio-frame"></div>
        </div>
        <div class="bio-scan-line" id="scanLine"></div>
    </div>

    <!-- ESTADO -->
    <div class="bio-estado" id="bioEstado">
        <div class="bio-spinner" id="spinner"></div>
        <p id="estadoTxt">Iniciando cámara...</p>
    </div>

    <!-- BOTONES -->
    <div class="bio-acciones">
        <button class="bio-btn-secundario" onclick="window.history.back()">Cancelar</button>
        <button class="bio-btn-principal" id="btnEscanear" disabled onclick="escanear()">
            Escanear rostro
        </button>
    </div>

</div>

<script src="biometria.js"></script>
</body>
</html>
