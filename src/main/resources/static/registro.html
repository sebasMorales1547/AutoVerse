<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AutoVerse Crear cuenta</title>
    <link rel="stylesheet" href="styles.css">
    <!-- face-api para extraer descriptor al registrarse -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body class="register-page">

<div class="container wide">

    <!-- Branding -->
    <div class="branding">
        <img src="Logo.png" alt="AutoVerse" class="logo-img">
    </div>

    <!-- Formulario -->
    <div class="register-form">

        <div class="form-row">
            <div class="form-group">
                <label>Cédula</label>
                <input type="text" id="cedula" placeholder="Número de cédula">
            </div>
            <div class="form-group">
                <label>Correo</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.com">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="nombre" placeholder="Tu nombre">
            </div>
            <div class="form-group">
                <label>Apellido</label>
                <input type="text" id="apellido" placeholder="Tu apellido">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="contrasena" placeholder="••••••••••">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" id="telefono" placeholder="+57 300 000 0000">
            </div>
        </div>

        <!-- FOTO BIOMÉTRICA -->
        <div class="form-group full-width">
            <label>📷 Foto de tu rostro <span style="color:#888;font-size:12px">(para verificación biométrica al comprar)</span></label>
            <input type="file" id="foto" accept="image/*" onchange="previsualizarFoto(this)">
            <div id="fotoPreview" style="display:none;margin-top:.75rem">
                <img id="imgPreview" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:2px solid #ffc400">
                <p style="font-size:12px;color:#888;margin-top:.25rem">Vista previa</p>
            </div>
        </div>

        <button type="button" id="btnRegistro">Crear cuenta</button>

        <p class="register">
            ¿Ya tienes cuenta? <a href="index.html">Iniciar sesión</a>
        </p>

    </div>
</div>

<script>
function previsualizarFoto(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById('imgPreview').src = e.target.result;
            document.getElementById('fotoPreview').style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
<script src="registro.js"></script>
</body>
</html>
