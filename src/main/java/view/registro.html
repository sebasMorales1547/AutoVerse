<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>AutoVerse Crear cuenta</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="register-page">

<div class="container wide">

   <!-- Lado izquierdo: branding -->
<div class="branding">
    <img src="Logo.png" alt="AutoVerse" class="logo-img">
</div>

    <!-- Lado derecho: formulario -->
    <div class="register-form">

        <div class="form-row">
            <div class="form-group">
                <label>Cédula</label>
                <input type="text" placeholder="Número de cédula">
            </div>
            <div class="form-group">
                <label>Correo</label>
                <input type="email" placeholder="correo@ejemplo.com">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" placeholder="Tu nombre">
            </div>
            <div class="form-group">
                <label>Apellido</label>
                <input type="text" placeholder="Tu apellido">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" placeholder="••••••••••">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="tel" placeholder="+57 300 000 0000">
            </div>
        </div>

        <button type="button">Crear cuenta</button>

        <p class="register">
            ¿Ya tienes cuenta? <a href="index.html">Iniciar sesión</a>
        </p>

    </div>

</div>

<script src="register.js"></script>

</body>
</html>
